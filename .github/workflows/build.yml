name: Build Fani Pro APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Generate Android files & disable Lint bug
        run: |
          flutter create . --org com.fanipro.app --project-name fani_pro_2027
          sed -i 's/<application/<uses-permission android:name="android.permission.INTERNET"\/>\n    <application/' android/app/src/main/AndroidManifest.xml
          if [ -f android/app/build.gradle.kts ]; then
            sed -i 's/android {/android {\n    lint {\n        checkReleaseBuilds = false\n        abortOnError = false\n    }/' android/app/build.gradle.kts
          elif [ -f android/app/build.gradle ]; then
            sed -i 's/android {/android {\n    lintOptions {\n        checkReleaseBuilds false\n        abortOnError false\n    }/' android/app/build.gradle
          fi

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FaniPro-2027-Test-APK
          path: build/app/outputs/flutter-apk/app-release.apk
